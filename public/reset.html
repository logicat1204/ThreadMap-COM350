<!doctype html>
<html lang="es" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Restablecer contraseña · ThreadMap</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script type="module" src="/appearance.js"></script><script type="module" src="/reset.js"></script></head>
<body class="admin-page"><main class="reset-main"><section class="admin-card"><a href="/" class="brand">Thread<span>Map</span></a><h1>Elige una nueva contraseña</h1><p class="admin-muted">El enlace es de un solo uso y caduca en 15 minutos. Al guardar, se cerrarán las sesiones anteriores de tu cuenta.</p><p id="reset-error" class="admin-error" role="alert" hidden></p><form id="reset-form" class="admin-form"><label for="reset-password">Nueva contraseña de tu cuenta</label><div class="password-entry"><input id="reset-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button type="button" class="icon-button" id="reset-reveal" aria-label="Mostrar contraseña" aria-pressed="false"></button></div><label for="reset-confirm">Repite la nueva contraseña</label><input id="reset-confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required><button class="primary-button" type="submit">Guardar contraseña</button></form><p id="reset-success" role="status" hidden>Contraseña actualizada. Ya puedes iniciar sesión con la nueva contraseña.</p><a href="/app?modo=login" class="text-button">Ir al inicio de sesión</a></section></main></body>
</html>
